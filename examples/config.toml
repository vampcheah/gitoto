# gitoto configuration
# Place this file at ~/.config/gitoto/config.toml

# Directories to scan for git repositories
root_dirs = ["~/Code"]

# Maximum depth to walk when discovering repos (default: 2)
scan_depth = 2

# Repos to always show at the top of the list
pinned_repos = []

# Patterns to exclude from repo discovery
# Matches against repo directory name or any path component
excluded_repos = ["node_modules", ".cargo"]

[watch]
# Filesystem change debounce interval in milliseconds (default: 500)
debounce_ms = 500

# Local status poll interval in seconds — catches missed watcher events (default: 5)
poll_local_secs = 5

# Remote fetch poll interval in seconds — updates ahead/behind from origin (default: 30)
poll_fetch_secs = 30

# Maximum concurrent status/fetch tasks (default: 4)
max_concurrent_polls = 4

# Run a full local scan every N local polls; other local polls focus on selected/uninitialized repos (default: 12)
poll_local_full_every = 12

[ui]
# Terminal refresh rate in frames per second (default: 10)
frame_rate = 10

# Check GitHub for newer releases on startup (default: false)
check_for_updates = false

# Where to show the update notification: "top-right" or "top-left" (default: "top-right")
update_position = "top-right"

[graph]
# Branch filter for commit graph: "all", "local", "remote", or "none" (default: "all")
branches = "all"

# Max length for branch/tag labels in the graph (default: 24)
label_max_len = 24

# Show +N/-M diff stats per commit (default: true)
show_stats = true

[status]
# Untracked scan mode: "all", "normal", or "none" (default: "all")
untracked = "all"

[performance]
# Start in fast mode: no automatic fetch polling, graph diff stats, or untracked scans (default: false)
fast_mode = false

[commit]
# Skip repository commit hooks when committing from gitoto (default: false)
# Enable this for untrusted repos if you do not want pre-commit hooks to run.
no_verify = false
